version: '3.8'

services:
  api:
    build: .
    container_name: agriguardian_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=agriguardian_db
      - JWT_SECRET_KEY=dev_secret_key_123456789
      - ENVIRONMENT=development
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo:latest
    container_name: agriguardian_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
